name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Flutter：交付給工程師的 styles/ 必須編得過、測得過 ──
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Test
        run: flutter test

  # ── Web：token 同步檢查 + 文件站建置 ──
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 擋住「改了 styles/*.dart 或 tokens.ts 卻沒改 tokens/*.json」的漂移
      - name: Check token drift
        run: npm run check:tokens
      # 擋住「本機看得到、上線 404」的圖片路徑與大小寫錯誤
      - name: Check asset references
        run: npm run check:assets
      # 擋住「元件頁少區塊」或「Configurations 混進顏色」
      - name: Check page structure
        run: npm run check:pages
      - name: Install and Build
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  # ── 兩邊都綠才部署；PR 只跑檢查不部署 ──
  deploy:
    needs: [flutter, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
